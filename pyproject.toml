[project]
name = "ats-gap-analyser"
version = "0.1.0"
description = "AI agent that analyses CV and job description fit, identifies ATS gaps, and generates improvement suggestions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "groq>=1.2.0",
    "minsearch>=0.0.5",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "logfire[query]>=4.32.1",
    "streamlit>=1.57.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "jupyter>=1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
